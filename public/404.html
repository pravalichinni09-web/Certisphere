<!doctype html>
<html><head><meta charset="utf-8"><title>Redirecting…</title>
<script>
  // GitHub Pages SPA shim: rewrite 404s back to index.html with the
  // original path encoded in the query string. The main app reads it back.
  var l = window.location;
  l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
           l.pathname.split('/').slice(0, 2).join('/') +
           '/?p=/' + l.pathname.split('/').slice(2).join('/').replace(/&/g, '~and~') +
           (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
           l.hash);
</script></head><body></body></html>
